services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devpath
      POSTGRES_PASSWORD: devpath
      POSTGRES_DB: devpath
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devpath -d devpath']
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    profiles: ['app']
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://devpath:devpath@db:5432/devpath?schema=public
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'npm run db:deploy -w backend && npm run db:seed -w backend && npm run start -w backend',
      ]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
